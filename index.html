  <meta property="og:image" content="https://i.meee.com.tw/3UprW3L.jpg">
  <meta property="og:title" content="2026 抽直屬互動遊戲">
  <meta property="og:description" content="點擊抽取你的神秘直屬家族！">

  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&amp;family=Fraunces:opsz,wght@9..144,700;9..144,800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #24313a;
      --coral: #f26855;
      --yellow: #ffd55c;
      --teal: #217f82;
    }
    * { box-sizing: border-box; }
    body { font-family: "Alegreya Sans", sans-serif; color: var(--ink); }
    .display-font { font-family: "Fraunces", serif; }
    .view { display: none; }
    .view.active { display: block; animation: rise .48s ease both; }
    .paper-card {
      border: 2px solid rgba(36,49,58,.13);
      box-shadow: 7px 8px 0 rgba(36,49,58,.16);
    }
    .doodle { position: absolute; pointer-events: none; user-select: none; opacity: .8; }
    .part-button, .photo-card { transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease; }
    .part-button:hover, .photo-card:hover:not(.is-picked) { transform: translateY(-5px) rotate(-1deg); }
    .part-button:focus-visible, .photo-card:focus-visible, .back-button:focus-visible {
      outline: 4px solid var(--ink);
      outline-offset: 4px;
    }
    .photo-card.is-picked { opacity: .45; filter: grayscale(1); cursor: not-allowed; transform: none; }
    .photo-card.is-picked .open-status { display: none; }
    .photo-card.is-picked .picked-status { display: flex; }
    .picked-status { display: none; }
    .gallery-group { display: none; }
    .gallery-group.active { display: grid; animation: rise .4s ease both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
 </head>

      "shoe-3": ["本人：莊秉澔","朱芯儀","呂玟誼","徐嘉謙","陶崇逸"],

      "shoe-7": ["學長：Cloud", "學姐：Tifa"],
      "shoe-8": ["學長：Sora", "學姐：Kairi"]
    };

    const selectedPeople = new Set();
    const views = document.querySelectorAll(".view");
    const groups = document.querySelectorAll(".gallery-group");
    const cards = document.querySelectorAll(".photo-card");
    const count = document.getElementById("picked-count");
    const resultSubtitle = document.getElementById("result-subtitle");
    const familyList = document.getElementById("family-list");

    function showView(id) {
      views.forEach(view => view.classList.toggle("active", view.id === id));
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateCards() {
      count.textContent = `已選 ${selectedPeople.size} / 41 位`;
      cards.forEach(card => {
        const picked = selectedPeople.has(card.dataset.person);
        card.classList.toggle("is-picked", picked);
        card.disabled = picked;
        card.setAttribute("aria-disabled", String(picked));
      });
    }

    document.querySelectorAll(".part-button").forEach(button => {
      button.addEventListener("click", () => {
        const group = button.dataset.group;
        document.getElementById("chosen-part-label").textContent = `本輪觀察：${button.dataset.name}`;
        groups.forEach(item => item.classList.toggle("active", item.id === `${group}-group`));
        updateCards();
        showView("gallery-view");
      });
    });

    document.getElementById("gallery-back").addEventListener("click", () => showView("home-view"));

    cards.forEach(card => {
      card.addEventListener("click", () => {
        const personKey = card.dataset.person;
        if (selectedPeople.has(personKey)) return;
        
        selectedPeople.add(personKey);
        const [group, number] = personKey.split("-");
        const labels = { finger: "手", eye: "眼睛", ear: "耳朵", mouth: "嘴巴", shoe: "鞋子" };
        
        resultSubtitle.textContent = `你抽中了「${labels[group]}組」第 ${String(number).padStart(2, "0")} 號家族！`;
        
        // 渲染該家族的所有成員名單
        familyList.innerHTML = "";
        const members = familyData[personKey] || ["尚無登記成員"];
        members.forEach(member => {
          const li = document.createElement("li");
          li.textContent = member;
          familyList.appendChild(li);
        });

        updateCards();
        showView("result-view");
      });
    });

    document.getElementById("home-back").addEventListener("click", () => showView("home-view"));
  </script>
</body>
